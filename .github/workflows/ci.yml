name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20   # same Ubuntu packages as the dev machine (GCC 13.2, newlib, mGBA 0.10)
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi build-essential git libmgba-dev=0.10.2+dfsg-1.1build3 cppcheck clang-tidy clang-format gcovr python3-pil librsvg2-bin
      - name: Cache pinned dependencies
        uses: actions/cache@v4
        with:
          path: build/deps
          key: deps-${{ hashFiles('scripts/fetch_deps.sh') }}
      - name: make check (format, lint, protocol + timing tests v1.1a/v1.1b)
        run: make check
      - name: Upload ROMs
        uses: actions/upload-artifact@v4
        with:
          name: roms
          path: |
            build/wgc-gba-tx-ui.gba
            build/v11b/wgc-gba-tx-ui.gba

  mutation:
    # ~45-60 min: runs on pushes to main (and by hand), not on every branch push or PR
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi build-essential git libmgba-dev=0.10.2+dfsg-1.1build3 python3-pil librsvg2-bin
      - name: Cache pinned dependencies
        uses: actions/cache@v4
        with:
          path: build/deps
          key: deps-${{ hashFiles('scripts/fetch_deps.sh') }}
      - name: make mutate (every valid mutant of src/link.c + src/core must be killed)
        run: make mutate
